name: finance_app
description: "Finance Copilot — gestion financière personnelle offline-first (nom provisoire)."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Material est livré comme package séparé depuis Flutter 3.50.
  material_ui: ^1.1.0
  # Uniquement requis par le code généré de gen-l10n ; les délégués Material
  # viennent de material_ui (voir lib/app/app.dart).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.2
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  local_auth: ^3.0.2
  cryptography: ^2.9.0
  file_picker: ^13.4.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Moteur SQLite embarqué : SQLite3MultipleCiphers (chiffrement de la base).
# Le binaire est téléchargé et vérifié (sha256) au premier build.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  # Génère lib/l10n/app_localizations.dart à partir de lib/l10n/*.arb.
  generate: true

  # Identité Finao : seules les pièces du splash animé sont embarquées ; le
  # reste de assets/brand/ sert de source aux générateurs ci-dessous.
  assets:
    - assets/brand/vector/finao-wordmark-light.svg
    - assets/brand/vector/finao-wordmark-dark.svg
    - assets/brand/vector/parts/

  # Polices embarquées (offline-first, aucun chargement réseau).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    # Icônes Phosphor 2.1.2 (MIT), mêmes codepoints que les maquettes.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf

# Icône de l'application : `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/ios/AppIcon-1024.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/brand/ios/AppIcon-1024-dark-transparent.png"
  image_path_ios_tinted_grayscale: "assets/brand/ios/AppIcon-1024-tinted.png"
  adaptive_icon_background: "#F3F0E8"
  adaptive_icon_foreground: "assets/brand/android/mipmap-xxxhdpi/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/brand/android/mipmap-xxxhdpi/ic_launcher_monochrome.png"
  # Les calques fournis respectent déjà la zone de sécurité de 108 dp.
  adaptive_icon_foreground_inset: 0

# Splash natif : `dart run flutter_native_splash:create`. Fond seul (le
# splash animé de lib/app/finao_splash.dart construit le cairn), sauf sur
# Android 12+ où le système affiche lui-même le cairn.
flutter_native_splash:
  # Barre d'état masquée (rendue par lib/app/finao_splash.dart).
  fullscreen: true
  color: "#F3F0E8"
  color_dark: "#174D3A"
  android_12:
    color: "#F3F0E8"
    color_dark: "#174D3A"
    image: assets/brand/splash/android12-splash-icon-light.png
    image_dark: assets/brand/splash/android12-splash-icon-dark.png
