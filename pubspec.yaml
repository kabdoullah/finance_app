name: finance_app
description: "Finance Copilot — gestion financière personnelle offline-first (nom provisoire)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # Material est livré comme package séparé depuis Flutter 3.50.
  material_ui: ^1.1.0
  # Uniquement requis par le code généré de gen-l10n ; les délégués Material
  # viennent de material_ui (voir lib/app/app.dart).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.2
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

# Moteur SQLite embarqué : SQLite3MultipleCiphers (chiffrement de la base).
# Le binaire est téléchargé et vérifié (sha256) au premier build.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  # Génère lib/l10n/app_localizations.dart à partir de lib/l10n/*.arb.
  generate: true

  # Polices embarquées (offline-first, aucun chargement réseau).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    # Icônes Phosphor 2.1.2 (MIT), mêmes codepoints que les maquettes.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
